name: Market Bot Run

on:
  schedule:
    # 台灣時間 08:05 (UTC 00:05) 執行
    - cron: '5 0 * * 1-5'
  workflow_dispatch: # 讓你可以在網頁上手動點「立即執行」

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 複製你的程式碼
        uses: actions/checkout@v3

      - name: 安裝 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安裝必要的工具
        run: |
          pip install -r requirements.txt

      - name: 開始跑程式
        run: python TW_stock.py  # 如果你的檔名不是 test.py，請改成你的檔名
