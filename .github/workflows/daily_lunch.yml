name: Daily Lunch Reminder

on:
  schedule:
    # 修改：改成 11:15 (UTC 03:15) 避開整點塞車，並觸發更新
    - cron: '50 3 * * *'
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 執行午餐腳本
        run: python lunch.py
